<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Reset password · Web Continuator</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <link rel="stylesheet" href="/assets/admin.css" />
    <script type="module" src="/assets/reset-password.js"></script>
  </head>
  <body class="admin-document">
    <main class="password-reset-page admin-card">
      <p class="admin-eyebrow">Web Continuator</p>
      <h1>Choose a new password</h1>
      <p>
        Use at least 8 characters. Changing your password signs you out on all
        devices and keeps your saved sessions.
      </p>
      <form id="password-reset-form">
        <label for="new-password">New password</label
        ><input
          id="new-password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          maxlength="128"
          required
        /><label for="confirm-password">Confirm new password</label
        ><input
          id="confirm-password"
          type="password"
          autocomplete="new-password"
          minlength="8"
          maxlength="128"
          required
        /><button id="reset-password-button" type="submit">
          Set new password
        </button>
      </form>
      <p id="reset-message" class="message-box" role="status"></p>
      <p><a href="/">Return to the instrument and sign in</a></p>
    </main>
  </body>
</html>
